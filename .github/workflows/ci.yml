name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node packages/core/dist/cli.js decide --policy packages/core/examples/policy.example.json --tool whois --args '{"domain":"example.org"}' --user "whois example.org"
      - name: Red-team report is reproducible
        run: npm run redteam && git diff --exit-code RESULTS.md
